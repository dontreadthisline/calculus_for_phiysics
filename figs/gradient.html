<div class="grad-fig">
<style>
.grad-fig { margin: 1.6em 0; }
.grad-fig svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.grad-fig .g-bar { display: flex; gap: .5em; margin-bottom: .6em; justify-content: center; }
.grad-fig .g-bar button { font: 500 .85em -apple-system,"PingFang SC",sans-serif; padding: .32em 1em;
  border: 1px solid #ddd8ce; border-radius: 6px; background: #fff; color: #24292f; cursor: pointer; }
.grad-fig .g-bar button:hover { border-color: #3a4aa8; color: #3a4aa8; }
.grad-fig .g-bar button.on { border-color: #3a4aa8; color: #fff; background: #3a4aa8; }
</style>
<div class="g-bar">
<button onclick="gSet(0)" id="gb0" class="on">f = x² + y² （碗）</button>
<button onclick="gSet(1)" id="gb1">f = x + 0.7y （斜坡）</button>
<button onclick="gSet(2)" id="gb2">f = x² − y² （鞍）</button>
</div>

<svg id="gradsvg" viewBox="0 0 360 350" width="360" height="350"></svg>
<script defer src="resources/js/figs/gradient.js?v=2"></script>
</div>
