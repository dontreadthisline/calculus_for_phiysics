project:
  type: book
  output-dir: book
  resources: [resources]

bibliography: references.bib

crossref:
  fig-title: "图"
  fig-prefix: "图"
  tbl-title: "表"
  tbl-prefix: "表"

book:
  title: "微积分的物理地图"
  subtitle: "为经典力学与电动力学重学微积分 — 一张自包含的语言地图"
  description: "不训练计算技能，只重建数学语言的阅读能力：微分与积分两个基本运算、微积分基本定理、坐标无关性，以及「定律→方程→条件选解」的完整流程，从一元走到向量场、ODE、PDE，直通物理书页。"
  page-navigation: true
  chapters:
    - index.qmd
    - conventions.qmd
    - 01-fundamentals.qmd
    - 02-ode.qmd
    - 03-space-curves.qmd
    - 04-curvilinear.qmd
    - 05-multivariable.qmd
    - 06-vector-fields.qmd
    - 07-multiple-integrals.qmd
    - 08-line-surface.qmd
    - 09-integral-theorems.qmd
    - 10-pde.qmd
    - reading-map.qmd

format:
  indigo-atlas-html:
    code-copy: true
    include-in-header: [back-to-landing.html, kx-head.html, figs-head.html]
    reference-location: section
    html-math-method:
      method: katex
      url: "resources/libs/katex/"
